    <style>
        /* Estilos de alto contraste para forzar la visibilidad del diagrama Mermaid */
        #er-svg {
            width: 100% !important;
            height: 100% !important;
            min-height: 500px;
        }

        /* Estilos para las cajas de entidades (Tablas) */
        #er-svg .entityBox {
            fill: #1e293b !important;
            stroke: #38bdf8 !important;
            stroke-width: 2px !important;
            rx: 6px !important;
            ry: 6px !important;
        }

        /* Títulos de las tablas */
        #er-svg .entityLabel, 
        #er-svg g.entityGroup text.entityLabel {
            fill: #ffffff !important;
            font-family: system-ui, -apple-system, sans-serif !important;
            font-weight: 700 !important;
            font-size: 14px !important;
        }

        /* Filas de atributos (impares y pares) */
        #er-svg .attributeBoxOdd {
            fill: #0f172a !important;
            stroke: #334155 !important;
        }

        #er-svg .attributeBoxEven {
            fill: #1e293b !important;
            stroke: #334155 !important;
        }

        /* Textos dentro de las tablas (Nombres de campos y tipos de datos) */
        #er-svg text, 
        #er-svg tspan, 
        #er-svg .attribute-type, 
        #er-svg .attribute-name {
            fill: #f1f5f9 !important;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace !important;
            font-size: 12px !important;
            opacity: 1 !important;
        }

        /* Claves primarias (PK) y foráneas (FK) */
        #er-svg text[title*="PK"], 
        #er-svg text[title*="FK"],
        #er-svg .pk-color,
        #er-svg .fk-color {
            fill: #38bdf8 !important;
            font-weight: bold !important;
        }

        /* Líneas de relación entre tablas */
        #er-svg .er.relationshipLine {
            stroke: #38bdf8 !important;
            stroke-width: 2px !important;
            stroke-dasharray: none !important;
        }

        /* Etiquetas de las relaciones */
        #er-svg .er.relationshipLabel {
            fill: #7dd3fc !important;
            font-family: system-ui, -apple-system, sans-serif !important;
            font-size: 11px !important;
            font-weight: 600 !important;
        }

        #er-svg .er.relationshipLabelBox {
            fill: #0f172a !important;
            stroke: #0284c7 !important;
            stroke-width: 1px !important;
            rx: 4px !important;
            ry: 4px !important;
            opacity: 0.95 !important;
        }

        /* Scrollbar personalizado para el menú lateral */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>

erDiagram

    <!-- Script Principal -->
    <script>
        let panZoomInstance = null;

        const categories = [
            {
                name: "Institucional",
                icon: "building-2",
                tables: ["INSTITUCION", "SEDE", "JORNADA", "GRADO", "GRUPO"]
            },
            {
                name: "Personas",
                icon: "users",
                tables: ["ESTUDIANTE", "DOCENTE", "ACUDIENTE", "ESTUDIANTE_ACUDIENTE"]
            },
            {
                name: "Gestión Académica",
                icon: "book-open",
                tables: ["ASIGNATURA", "ANIO_LECTIVO", "PERIODO", "GRADO_ASIGNATURA", "MATRICULA", "CARGA_ACADEMICA"]
            },
            {
                name: "Evaluaciones & Notas",
                icon: "file-check",
                tables: ["TIPO_EVALUACION", "EVALUACION", "PREGUNTA", "OPCION_RESPUESTA", "CALIFICACION", "RESPUESTA_ESTUDIANTE", "ACTIVIDAD_RECUPERACION"]
            },
            {
                name: "Competencias & Logros",
                icon: "award",
                tables: ["COMPETENCIA", "LOGRO"]
            },
            {
                name: "Asistencia & Conducta",
                icon: "clipboard-list",
                tables: ["ASISTENCIA", "OBSERVACION_COMPORTAMIENTO"]
            },
            {
                name: "Ubicación & Horarios",
                icon: "map-pin",
                tables: ["DEPARTAMENTO", "MUNICIPIO", "DIA_SEMANA", "HORARIO"]
            },
            {
                name: "Seguridad & Sistema",
                icon: "shield-check",
                tables: ["USUARIOS", "MODULO", "PERMISO", "ROL", "ROL_PERMISO", "ARCHIVO_DIGITAL"]
            }
        ];

        // Configuración de Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            er: {
                useMaxWidth: false,
                layoutDirection: 'TB',
                minEntityWidth: 160,
                minEntityHeight: 70,
                entityPadding: 15
            }
        });

        document.addEventListener("DOMContentLoaded", async () => {
            // Inicializar Lucide Icons
            lucide.createIcons();

            // Llenar la barra lateral
            populateSidebar();

            // Renderizar Mermaid
            const mermaidCode = document.getElementById("mermaid-code").textContent;
            const target = document.getElementById("mermaid-target");

            try {
                const { svg } = await mermaid.render("er-svg-container", mermaidCode);
                target.innerHTML = svg;

                const svgElement = target.querySelector("svg");
                svgElement.setAttribute("id", "er-svg");
                
                // Ocultar Loader y mostrar contenedor
                document.getElementById("loader").classList.add("hidden");
                const wrapper = document.getElementById("diagram-wrapper");
                wrapper.classList.remove("opacity-0");

                // Configurar Pan & Zoom
                panZoomInstance = svgPanZoom("#er-svg", {
                    zoomEnabled: true,
                    controlIconsEnabled: false,
                    fit: true,
                    center: true,
                    minZoom: 0.1,
                    maxZoom: 10,
                    zoomScaleSensitivity: 0.2
                });

                window.addEventListener("resize", () => {
                    if (panZoomInstance) {
                        panZoomInstance.resize();
                        panZoomInstance.fit();
                        panZoomInstance.center();
                    }
                });

            } catch (err) {
                console.error("Error al renderizar Mermaid:", err);
                document.getElementById("loader").innerHTML = `
                    <div class="text-red-400 text-center px-4">
                        <p class="font-semibold text-sm">Error al generar el diagrama</p>
                        <p class="text-xs text-red-300 mt-1">${err.message || 'Error de sintaxis o renderizado en Mermaid.'}</p>
                    </div>
                `;
            }

            // Controles de zoom
            document.getElementById("btn-zoom-in").addEventListener("click", () => panZoomInstance && panZoomInstance.zoomIn());
            document.getElementById("btn-zoom-out").addEventListener("click", () => panZoomInstance && panZoomInstance.zoomOut());
            document.getElementById("btn-zoom-reset").addEventListener("click", () => {
                if (panZoomInstance) {
                    panZoomInstance.resetZoom();
                    panZoomInstance.fit();
                    panZoomInstance.center();
                }
            });

            // Exportar SVG
            document.getElementById("btn-export-svg").addEventListener("click", downloadSVG);

            // Toggle Sidebar Móvil
            const sidebar = document.getElementById("sidebar");
            document.getElementById("btn-toggle-sidebar").addEventListener("click", () => {
                sidebar.classList.toggle("-translate-x-full");
            });

            const closeSidebarBtn = document.getElementById("btn-close-sidebar");
            if (closeSidebarBtn) {
                closeSidebarBtn.addEventListener("click", () => {
                    sidebar.classList.add("-translate-x-full");
                });
            }

            // Buscador
            document.getElementById("table-search").addEventListener("input", filterSidebarTables);
        });

        function populateSidebar() {
            const container = document.getElementById("categories-container");
            let totalCount = 0;

            categories.forEach((cat, index) => {
                totalCount += cat.tables.length;

                const section = document.createElement("div");
                section.className = "category-group space-y-1";

                const categoryHeader = `
                    <button class="w-full flex items-center justify-between p-1.5 text-xs font-semibold text-slate-400 hover:text-slate-200 transition rounded" onclick="toggleCategory('cat-${index}')">
                        <span class="flex items-center gap-2">
                            <i data-lucide="${cat.icon}" class="w-3.5 h-3.5 text-brand-400"></i>
                            ${cat.name}
                        </span>
                        <span class="text-[10px] bg-slate-800 text-slate-300 px-1.5 py-0.2 rounded-full border border-slate-700/60">${cat.tables.length}</span>
                    </button>
                `;

                const tableList = document.createElement("div");
                tableList.id = `cat-${index}`;
                tableList.className = "pl-4 space-y-0.5 text-xs";

                cat.tables.forEach(tableName => {
                    const btn = document.createElement("button");
                    btn.className = "table-btn w-full text-left py-1 px-2 rounded text-slate-300 hover:bg-slate-800 hover:text-brand-300 transition flex items-center justify-between group";
                    btn.setAttribute("data-table", tableName);
                    btn.innerHTML = `
                        <span class="font-mono text-[11px]">${tableName}</span>
                        <i data-lucide="chevron-right" class="w-3 h-3 text-slate-600 group-hover:text-brand-400 opacity-0 group-hover:opacity-100 transition"></i>
                    `;
                    btn.onclick = () => focusTable(tableName);
                    tableList.appendChild(btn);
                });

                section.innerHTML = categoryHeader;
                section.appendChild(tableList);
                container.appendChild(section);
            });

            document.getElementById("total-entities").textContent = totalCount;
            lucide.createIcons();
        }

        function toggleCategory(id) {
            const el = document.getElementById(id);
            if (el) el.classList.toggle("hidden");
        }

        function filterSidebarTables(e) {
            const query = e.target.value.toLowerCase().trim();
            const tableButtons = document.querySelectorAll(".table-btn");

            tableButtons.forEach(btn => {
                const name = btn.getAttribute("data-table").toLowerCase();
                if (name.includes(query)) {
                    btn.style.display = "flex";
                } else {
                    btn.style.display = "none";
                }
            });
        }

        function focusTable(tableName) {
            const svg = document.getElementById("er-svg");
            if (!svg || !panZoomInstance) return;

            const allGroups = svg.querySelectorAll("g");
            let targetGroup = null;

            allGroups.forEach(g => {
                const textEl = g.querySelector("text, tspan");
                if (textEl && textEl.textContent.trim().toUpperCase() === tableName.toUpperCase()) {
                    targetGroup = g.closest(".entityBox") || g;
                }
            });

            if (targetGroup) {
                const rect = targetGroup.querySelector("rect");
                if (rect) {
                    const originalStroke = rect.getAttribute("stroke");
                    rect.setAttribute("stroke", "#38bdf8");
                    rect.setAttribute("stroke-width", "4");

                    setTimeout(() => {
                        rect.setAttribute("stroke", originalStroke || "#38bdf8");
                        rect.setAttribute("stroke-width", "2");
                    }, 2500);
                }

                // Cerrar sidebar en móvil tras seleccionar
                if (window.innerWidth < 768) {
                    document.getElementById("sidebar").classList.add("-translate-x-full");
                }
            }
        }

        function downloadSVG() {
            const svg = document.getElementById("er-svg");
            if (!svg) return;

            const svgData = new XMLSerializer().serializeToString(svg);
            const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);

            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "diagrama_entidad_relacion_academico.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
