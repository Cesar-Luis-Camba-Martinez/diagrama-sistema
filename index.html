<!DOCTYPE html>

<body class="h-full bg-slate-900 text-slate-100 font-sans flex flex-col overflow-hidden transition-colors duration-200 dark:bg-slate-950 dark:text-slate-100 light:bg-slate-50 light:text-slate-900">

    <!-- Header Navigation -->

        <div class="flex items-center gap-3">

            <div>
                <h1 class="font-bold text-lg leading-tight text-slate-100">Visor de Diagrama E-R</h1>

        <!-- Controls Toolbar -->

                <button id="btn-zoom-in" title="Acercar (+)" class="p-2 hover:bg-slate-700/70 rounded text-slate-300 hover:text-white transition">
                    <i data-lucide="zoom-in" class="w-4 h-4"></i>
                </button>
                <button id="btn-zoom-out" title="Alejar (-)" class="p-2 hover:bg-slate-700/70 rounded text-slate-300 hover:text-white transition">
                    <i data-lucide="zoom-out" class="w-4 h-4"></i>
                </button>
                <button id="btn-zoom-reset" title="Restablecer Vista" class="p-2 hover:bg-slate-700/70 rounded text-slate-300 hover:text-white transition">

                </button>
            </div>

            <div class="h-6 w-px bg-slate-800"></div>

            <!-- Export Buttons -->

            <div class="p-4 border-b border-slate-800">

                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>

    <!-- Mermaid Raw Definition -->
    <script type="text/mermaid" id="mermaid-code">
erDiagram
    %% Tablas principales institucionales
    INSTITUCION {
        int id_institucion PK
        varchar nombre
        varchar codigo_dane
    }
    
    SEDE {
        int id_sede PK
        varchar nombre
        varchar direccion
        int id_institucion FK
        int id_municipio FK
    }
    
    JORNADA {
        int id_jornada PK
        varchar nombre
    }
    
    GRADO {
        int id_grado PK
        varchar nombre
    }
    
    GRUPO {
        int id_grupo PK
        varchar nombre
        int id_grado FK
        int id_sede FK
        int id_jornada FK
    }
    
    %% Tablas de personas
    ESTUDIANTE {
        int id_estudiante PK
        varchar nombres
        varchar apellidos
        varchar documento_identidad
        date fecha_nacimiento
        varchar tipo_documento
        varchar telefono
        varchar correo_electronico
        varchar direccion
        int id_municipio FK
    }
    
    DOCENTE {
        int id_docente PK
        varchar nombres
        varchar apellidos
        varchar documento_identidad
        varchar profesion
        varchar tipo_documento
        varchar telefono
        varchar correo_electronico
    }
    
    ACUDIENTE {
        int id_acudiente PK
        varchar nombres
        varchar apellidos
        varchar documento_identidad
        varchar tipo_documento
        varchar telefono
        varchar direccion
        varchar correo_electronico
    }
    
    ESTUDIANTE_ACUDIENTE {
        int id_estudiante PK,FK
        int id_acudiente PK,FK
        varchar parentesco
        boolean es_principal
    }
    
    %% Tablas académicas
    ASIGNATURA {
        int id_asignatura PK
        varchar nombre
        int intensidad_horaria
    }
    
    ANIO_LECTIVO {
        int id_anio_lectivo PK
        int anio
        date fecha_inicio
        date fecha_fin
        varchar estado
    }
    
    PERIODO {
        int id_periodo PK
        varchar nombre
        date fecha_inicio
        date fecha_fin
        int id_anio_lectivo FK
    }
    
    GRADO_ASIGNATURA {
        int id_grado PK,FK
        int id_asignatura PK,FK
    }
    
    MATRICULA {
        int id_matricula PK
        int id_estudiante FK
        int id_grupo FK
        date fecha_matricula
        varchar estado
        int id_anio_lectivo FK
    }
    
    CARGA_ACADEMICA {
        int id_carga PK
        int id_docente FK
        int id_grupo FK
        int id_asignatura FK
        int id_anio_lectivo FK
    }
    
    %% Tablas de evaluación
    TIPO_EVALUACION {
        int id_tipo_evaluacion PK
        varchar nombre
        varchar descripcion
    }
    
    EVALUACION {
        int id_evaluacion PK
        int id_carga_academica FK
        int id_periodo FK
        int id_tipo_evaluacion FK
        varchar nombre
        text descripcion
        date fecha_presentacion
        int id_logro FK
    }
    
    PREGUNTA {
        int id_pregunta PK
        int id_evaluacion FK
        varchar enunciado
        varchar tipo
        numeric peso
    }
    
    OPCION_RESPUESTA {
        int id_opcion PK
        int id_pregunta FK
        varchar texto
        boolean es_correcta
    }
    
    CALIFICACION {
        int id_calificacion PK
        int id_evaluacion FK
        int id_matricula FK
        numeric nota
        varchar observaciones
        timestamp fecha_calificacion
    }
    
    RESPUESTA_ESTUDIANTE {
        int id_respuesta PK
        int id_pregunta FK
        int id_calificacion FK
        varchar respuesta
        numeric puntaje_obtenido
        int id_opcion_seleccionada FK
    }
    
    ACTIVIDAD_RECUPERACION {
        int id_recuperacion PK
        int id_calificacion FK
        date fecha
        text descripcion
        numeric nota_recuperacion
        timestamp fecha_calificacion
    }
    
    %% Tablas de competencias y logros
    COMPETENCIA {
        int id_competencia PK
        varchar nombre
        text descripcion
        int id_asignatura FK
        int id_grado FK
    }
    
    LOGRO {
        int id_logro PK
        text descripcion
        int id_competencia FK
        int id_periodo FK
        numeric porcentaje
    }
    
    %% Tablas de asistencia y comportamiento
    ASISTENCIA {
        int id_asistencia PK
        int id_matricula FK
        date fecha
        varchar estado
        varchar observaciones
        timestamp fecha_registro
    }
    
    OBSERVACION_COMPORTAMIENTO {
        int id_observacion PK
        int id_matricula FK
        int id_docente_observador FK
        int id_carga_academica FK
        timestamp fecha_hora
        text descripcion
        varchar tipo_observacion
        varchar acciones_tomadas
    }
    
    %% Tablas para ubicación
    DEPARTAMENTO {
        int id_departamento PK
        varchar nombre
        varchar codigo
    }
    
    MUNICIPIO {
        int id_municipio PK
        varchar nombre
        varchar codigo
        int id_departamento FK
    }
    
    %% Tablas para horarios
    DIA_SEMANA {
        int id_dia PK
        varchar nombre
        smallint codigo
    }
    
    HORARIO {
        int id_horario PK
        int id_carga_academica FK
        smallint id_dia FK
        time hora_inicio
        time hora_fin
    }
    
    %% Tablas para archivos
    ARCHIVO_DIGITAL {
        int id_archivo PK
        varchar tipo_archivo
        varchar nombre_archivo
        varchar ruta_almacenamiento
        varchar mime_type
        timestamp fecha_carga
        int id_usuario_carga FK
        varchar entidad_relacionada
        int id_entidad
    }
    
    %% Tablas para seguridad y permisos
    USUARIOS {
        int id_usuario PK
        varchar nombre_usuario
        varchar clave
        int id_docente FK
        int id_estudiante FK
        boolean activo
        varchar salt
        int id_rol FK
    }
    
    MODULO {
        int id_modulo PK
        varchar nombre
        varchar descripcion
        varchar codigo
    }
    
    PERMISO {
        int id_permiso PK
        varchar nombre
        varchar descripcion
        varchar codigo
        int id_modulo FK
    }
    
    ROL {
        int id_rol PK
        varchar nombre
        varchar descripcion
        boolean es_rol_sistema
    }
    
    ROL_PERMISO {
        int id_rol PK,FK
        int id_permiso PK,FK
    }

    %% Relaciones principales
    INSTITUCION ||--o{ SEDE : tiene
    SEDE }|--o{ GRUPO : contiene
    GRADO ||--o{ GRUPO : clasifica
    JORNADA ||--o{ GRUPO : define
    
    ESTUDIANTE ||--o{ MATRICULA : se_registra_en
    GRUPO ||--o{ MATRICULA : incluye
    ANIO_LECTIVO ||--o{ MATRICULA : corresponde_a
    MATRICULA ||--o{ CALIFICACION : recibe
    MATRICULA ||--o{ ASISTENCIA : registra
    MATRICULA ||--o{ OBSERVACION_COMPORTAMIENTO : tiene
    
    ESTUDIANTE }o--o{ ACUDIENTE : tiene_como_acudiente
    
    DOCENTE ||--o{ CARGA_ACADEMICA : es_asignado_a
    GRUPO ||--o{ CARGA_ACADEMICA : es_asignado
    ASIGNATURA ||--o{ CARGA_ACADEMICA : es_parte_de
    ANIO_LECTIVO ||--o{ CARGA_ACADEMICA : ocurre_en
    
    GRADO }o--o{ ASIGNATURA : incluye
    
    ANIO_LECTIVO ||--o{ PERIODO : se_divide_en
    
    ASIGNATURA ||--o{ COMPETENCIA : tiene
    GRADO ||--o{ COMPETENCIA : define
    COMPETENCIA ||--o{ LOGRO : establece
    PERIODO ||--o{ LOGRO : evalua_en
    
    CARGA_ACADEMICA ||--o{ EVALUACION : programa
    PERIODO ||--o{ EVALUACION : pertenece_a
    TIPO_EVALUACION ||--o{ EVALUACION : clasifica
    LOGRO ||--o{ EVALUACION : mide
    
    EVALUACION ||--o{ PREGUNTA : compuesta_por
    PREGUNTA ||--o{ OPCION_RESPUESTA : contiene
    
    EVALUACION ||--o{ CALIFICACION : genera
    CALIFICACION ||--o{ RESPUESTA_ESTUDIANTE : registra
    PREGUNTA ||--o{ RESPUESTA_ESTUDIANTE : responde
    OPCION_RESPUESTA ||--o{ RESPUESTA_ESTUDIANTE : selecciona
    
    CALIFICACION ||--o{ ACTIVIDAD_RECUPERACION : puede_tener
    
    CARGA_ACADEMICA ||--o{ HORARIO : programa
    DIA_SEMANA ||--o{ HORARIO : ocurre_en
    
    DEPARTAMENTO ||--o{ MUNICIPIO : contiene
    MUNICIPIO ||--o{ ESTUDIANTE : reside_en
    MUNICIPIO ||--o{ SEDE : ubicada_en
    
    DOCENTE ||--o{ OBSERVACION_COMPORTAMIENTO : registra
    
    MODULO ||--o{ PERMISO : agrupa
    ROL }o--o{ PERMISO : tiene_asignado
    
    ROL ||--o{ USUARIOS : tiene_rol
    ESTUDIANTE |o--o| USUARIOS : puede_tener
    DOCENTE |o--o| USUARIOS : puede_tener
    USUARIOS ||--o{ ARCHIVO_DIGITAL : carga
    </script>

    <!-- Application Script -->
    <script>
        let panZoomInstance = null;

        // Categorías predefinidas para organizar las tablas en la barra lateral
        const categories = [
            {
                name: "Institucional",
                icon: "building-2",
                tables: ["INSTITUCION", "SEDE", "JORNADA", "GRADO", "GRUPO"]
            },
            {
                name: "Personas",
                icon: "users",
                tables: ["ESTUDIANTE", "DOCENTE", "ACUDIENTE", "ESTUDIANTE_ACUDIENTE"]
            },
            {
                name: "Gestión Académica",
                icon: "book-open",
                tables: ["ASIGNATURA", "ANIO_LECTIVO", "PERIODO", "GRADO_ASIGNATURA", "MATRICULA", "CARGA_ACADEMICA"]
            },
            {
                name: "Evaluaciones & Notas",
                icon: "file-check",
                tables: ["TIPO_EVALUACION", "EVALUACION", "PREGUNTA", "OPCION_RESPUESTA", "CALIFICACION", "RESPUESTA_ESTUDIANTE", "ACTIVIDAD_RECUPERACION"]
            },
            {
                name: "Competencias & Logros",
                icon: "award",
                tables: ["COMPETENCIA", "LOGRO"]
            },
            {
                name: "Asistencia & Conducta",
                icon: "clipboard-list",
                tables: ["ASISTENCIA", "OBSERVACION_COMPORTAMIENTO"]
            },
            {
                name: "Ubicación & Horarios",
                icon: "map-pin",
                tables: ["DEPARTAMENTO", "MUNICIPIO", "DIA_SEMANA", "HORARIO"]
            },
            {
                name: "Seguridad & Sistema",
                icon: "shield-check",
                tables: ["USUARIOS", "MODULO", "PERMISO", "ROL", "ROL_PERMISO", "ARCHIVO_DIGITAL"]
            }
        ];

        // Inicializar Mermaid
        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            er: {
                useMaxWidth: false,
                layoutDirection: 'TB',
                minEntityWidth: 160,
                minEntityHeight: 75,
                entityPadding: 15
            },
            themeVariables: {
                primaryColor: '#0369a1',
                primaryTextColor: '#f8fafc',
                primaryBorderColor: '#0284c7',
                lineColor: '#64748b',
                secondaryColor: '#1e293b',
                tertiaryColor: '#0f172a'
            }
        });

        document.addEventListener("DOMContentLoaded", async () => {
            // Inicializar Lucide Icons
            lucide.createIcons();

            // Llenar sidebar
            populateSidebar();

            // Renderizar Mermaid
            const mermaidCode = document.getElementById("mermaid-code").textContent;
            const target = document.getElementById("mermaid-target");

            try {
                const { svg } = await mermaid.render("mermaid-svg", mermaidCode);
                target.innerHTML = svg;

                const svgElement = target.querySelector("svg");
                svgElement.setAttribute("id", "er-svg");
                
                // Ocultar Loader y mostrar wrapper
                document.getElementById("loader").classList.add("hidden");
                const wrapper = document.getElementById("diagram-wrapper");
                wrapper.classList.remove("opacity-0");

                // Configurar Pan & Zoom
                panZoomInstance = svgPanZoom("#er-svg", {
                    zoomEnabled: true,
                    controlIconsEnabled: false,
                    fit: true,
                    center: true,
                    minZoom: 0.1,
                    maxZoom: 10,
                    zoomScaleSensitivity: 0.25
                });

                // Escuchar resize de ventana
                window.addEventListener("resize", () => {
                    panZoomInstance.resize();
                    panZoomInstance.fit();
                    panZoomInstance.center();
                });

            } catch (err) {
                console.error("Error al renderizar Mermaid:", err);
                document.getElementById("loader").innerHTML = `
                    <div class="text-red-400 text-center px-4">
                        <p class="font-semibold">Error al cargar el diagrama</p>
                        <p class="text-xs text-red-500 mt-1">${err.message || 'Verifica la consola para más detalles.'}</p>
                    </div>
                `;
            }

            // Event Listeners de los botones de control
            document.getElementById("btn-zoom-in").addEventListener("click", () => panZoomInstance && panZoomInstance.zoomIn());
            document.getElementById("btn-zoom-out").addEventListener("click", () => panZoomInstance && panZoomInstance.zoomOut());
            document.getElementById("btn-zoom-reset").addEventListener("click", () => {
                if (panZoomInstance) {
                    panZoomInstance.resetZoom();
                    panZoomInstance.fit();
                    panZoomInstance.center();
                }
            });

            // Exportar SVG
            document.getElementById("btn-export-svg").addEventListener("click", downloadSVG);

            // Toggle Sidebar Móvil
            document.getElementById("btn-toggle-sidebar").addEventListener("click", () => {
                const sidebar = document.getElementById("sidebar");
                sidebar.classList.toggle("-translate-x-full");
            });

            // Buscador
            document.getElementById("table-search").addEventListener("input", filterSidebarTables);
        });

        function populateSidebar() {
            const container = document.getElementById("categories-container");
            let totalCount = 0;

            categories.forEach((cat, index) => {
                totalCount += cat.tables.length;

                const section = document.createElement("div");
                section.className = "category-group space-y-1";

                const categoryHeader = `
                    <button class="w-full flex items-center justify-between p-1.5 text-xs font-semibold text-slate-400 hover:text-slate-200 transition rounded" onclick="toggleCategory('cat-${index}')">
                        <span class="flex items-center gap-2">
                            <i data-lucide="${cat.icon}" class="w-3.5 h-3.5 text-brand-400"></i>
                            ${cat.name}
                        </span>
                        <span class="text-[10px] bg-slate-800 text-slate-400 px-1.5 py-0.2 rounded-full border border-slate-700/50">${cat.tables.length}</span>
                    </button>
                `;

                const tableList = document.createElement("div");
                tableList.id = `cat-${index}`;
                tableList.className = "pl-5 space-y-0.5 text-xs";

                cat.tables.forEach(tableName => {
                    const btn = document.createElement("button");
                    btn.className = "table-btn w-full text-left py-1 px-2 rounded text-slate-300 hover:bg-slate-800 hover:text-brand-300 transition flex items-center justify-between group";
                    btn.setAttribute("data-table", tableName);
                    btn.innerHTML = `
                        <span>${tableName}</span>
                        <i data-lucide="chevron-right" class="w-3 h-3 text-slate-600 group-hover:text-brand-400 opacity-0 group-hover:opacity-100 transition"></i>
                    `;
                    btn.onclick = () => focusTable(tableName);
                    tableList.appendChild(btn);
                });

                section.innerHTML = categoryHeader;
                section.appendChild(tableList);
                container.appendChild(section);
            });

            document.getElementById("total-entities").textContent = totalCount;
            lucide.createIcons();
        }

        function toggleCategory(id) {
            const el = document.getElementById(id);
            if (el) {
                el.classList.toggle("hidden");
            }
        }

        function filterSidebarTables(e) {
            const query = e.target.value.toLowerCase().trim();
            const tableButtons = document.querySelectorAll(".table-btn");

            tableButtons.forEach(btn => {
                const name = btn.getAttribute("data-table").toLowerCase();
                if (name.includes(query)) {
                    btn.style.display = "flex";
                } else {
                    btn.style.display = "none";
                }
            });
        }

        function focusTable(tableName) {
            if (!panZoomInstance) return;

            // Intentar buscar el nodo SVG de la tabla por id o texto
            const svg = document.getElementById("er-svg");
            if (!svg) return;

            // En Mermaid ER, los elementos suelen tener IDs basados en la entidad
            const allElements = svg.querySelectorAll("g");
            let targetGroup = null;

            allElements.forEach(g => {
                const textEl = g.querySelector("text, tspan");
                if (textEl && textEl.textContent.trim().toUpperCase() === tableName.toUpperCase()) {
                    targetGroup = g.closest(".entityBox") || g;
                }
            });

            if (targetGroup) {
                // Resaltar visualmente de forma temporal
                const rect = targetGroup.querySelector("rect");
                if (rect) {
                    const originalStroke = rect.getAttribute("stroke");
                    const originalWidth = rect.getAttribute("stroke-width");
                    rect.setAttribute("stroke", "#38bdf8");
                    rect.setAttribute("stroke-width", "4");

                    setTimeout(() => {
                        rect.setAttribute("stroke", originalStroke || "");
                        rect.setAttribute("stroke-width", originalWidth || "1");
                    }, 2500);
                }

                // Ajustar zoom para centrar aproximadamente
                const bbox = targetGroup.getBBox();
                const svgRect = svg.getBoundingClientRect();
                
                panZoomInstance.zoomAtPoint(1.8, {
                    x: bbox.x + (bbox.width / 2),
                    y: bbox.y + (bbox.height / 2)
                });
            }
        }

        function downloadSVG() {
            const svg = document.getElementById("er-svg");
            if (!svg) return;

            const svgData = new XMLSerializer().serializeToString(svg);
            const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(blob);

            const downloadLink = document.createElement("a");
            downloadLink.href = url;
            downloadLink.download = "diagrama_entidad_relacion_academico.svg";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
